  --ui-cyan: #5dd9f4;

* { box-sizing: border-box; }
html { min-width: 320px; scroll-padding-top: calc(var(--ui-header-space) + 16px); }
body { margin: 0; background: var(--ui-bg); color: var(--ui-ink); font: 14px/1.55 var(--ui-font); }
button, input, select, textarea { font: inherit; }
button, input, select, textarea, summary { -webkit-tap-highlight-color: transparent; }
button, .ui-button { min-height: 38px; border-radius: var(--ui-control-radius); }
input:not([type="checkbox"]):not([type="radio"]), select, textarea {
  max-width: 100%; border: 1px solid var(--ui-line-strong); border-radius: var(--ui-control-radius);
  background: var(--ui-surface); color: var(--ui-ink); padding: 9px 12px;
}
input::placeholder, textarea::placeholder { color: var(--ui-muted); opacity: .9; }
input[type="checkbox"], input[type="radio"] { accent-color: #6254e8; }
button:disabled { cursor: not-allowed; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--ui-blue); outline-offset: 3px;
}
a { color: var(--ui-blue); text-underline-offset: 3px; }
h1, h2, h3 { color: var(--ui-ink); letter-spacing: -.025em; }
h1 { line-height: 1.25; }
pre, code, kbd { overflow-wrap: anywhere; }
pre { background: var(--ui-surface-tint); color: var(--ui-ink); border: 1px solid var(--ui-line); border-radius: 10px; }
[hidden] { display: none !important; }
.suite-topbar {

  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 10px 24px; color: var(--ui-ink); background: var(--ui-surface);
  border: 0; border-bottom: 1px solid var(--ui-line); box-shadow: 0 1px 8px rgb(54 74 118 / 3%);
}
.suite-topbar .product-brand { color: var(--ui-ink); display: flex; align-items: center; gap: 10px; min-width: 0; }
.suite-topbar .product-name, .suite-topbar .product-brand strong { color: var(--ui-ink); font-size: 18px; }
.suite-topbar .product-subtitle, .suite-topbar .privacy-state, .suite-topbar .sync-state,
.suite-topbar #sync-state, .suite-topbar .suite-kicker, .suite-topbar .product-brand small { color: var(--ui-muted); }
.suite-topbar .brand-mark, .ui-brand-icon {
  display: inline-grid; width: 34px; height: 34px; border: 0; border-radius: 11px;

}
.suite-topbar .brand-mark svg, .ui-brand-icon svg { width: 19px; height: 19px; }

.suite-topbar .suite-menu a { color: var(--ui-ink); border-radius: 8px; }
.suite-topbar .suite-menu a.current { color: var(--ui-primary); background: var(--ui-primary-soft); }
.suite-ui-tools { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.suite-theme-label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--ui-muted); font-size: 12px; }
.suite-theme-label select { min-height: 34px; width: 104px; padding: 6px 8px; font-size: 12px; border-color: var(--ui-line); }
.suite-menu-toggle { display: none; align-items: center; justify-content: center; width: 38px; padding: 8px; background: var(--ui-surface); color: var(--ui-ink); border: 1px solid var(--ui-line); }
.suite-menu-toggle svg { width: 18px; height: 18px; }
.suite-has-header { padding-top: var(--ui-header-space); }
.suite-has-sidebar .shell { display: block; }
:is(#mainnav, #tabs, #suite-product-nav, nav.suite-side-nav).suite-side-nav {
  position: fixed; inset: var(--ui-header-space) auto 0 0; z-index: 60; display: flex;

  overflow-y: auto; overscroll-behavior: contain; border: 0; border-right: 1px solid var(--ui-line);
  background: var(--ui-surface); box-shadow: none;
}
:is(#mainnav, #tabs, #suite-product-nav, nav.suite-side-nav).suite-side-nav > :is(a, button) {
  position: relative; display: flex; align-items: center; justify-content: flex-start; gap: 10px;
  flex: 0 0 auto; width: 100%; min-width: 0; min-height: 43px; margin: 0; padding: 10px 13px;
  border: 0; border-radius: 9px; background: transparent; color: var(--ui-muted);
  text-align: start; text-decoration: none; font-size: 13px; line-height: 1.45;
}
:is(#mainnav, #tabs, #suite-product-nav, nav.suite-side-nav).suite-side-nav > :is(a, button):hover { background: var(--ui-surface-tint); color: var(--ui-ink); }
:is(#mainnav, #tabs, #suite-product-nav, nav.suite-side-nav).suite-side-nav > :is(.active, [aria-current="page"], [aria-selected="true"]) {
  color: var(--ui-primary); background: var(--ui-primary-soft); font-weight: 650;
}
.suite-side-nav svg { width: 17px; height: 17px; flex: 0 0 auto; color: currentColor; }
.suite-side-nav .nav-divider { margin: 18px 12px 4px; color: var(--ui-muted); font-size: 11px; }
.suite-side-nav .nav-count, .suite-side-nav .tab-badge { margin-inline-start: auto; }
.suite-has-sidebar main.suite-main { width: calc(100% - var(--ui-rail)); max-width: 1600px; min-width: 0; margin: 0 0 0 var(--ui-rail); padding: 28px clamp(20px, 3vw, 40px) 64px; }
.suite-has-sidebar > .footer { margin-inline-start: var(--ui-rail); }
.ui-card, .panel, .chart-panel, .table-wrap, .card, .adapter-card,
.suite-main .start-panel, .suite-main .provider-grid > article {
  border: 1px solid var(--ui-line); border-radius: var(--ui-radius);
  background: var(--ui-surface); color: var(--ui-ink); box-shadow: var(--ui-shadow);
}
.ui-card { padding: 20px; }
.ui-card h2, .ui-card h3 { margin-top: 0; }
.ui-card-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
.ui-eyebrow { color: var(--ui-muted); text-transform: uppercase; font-size: 11px; font-weight: 650; letter-spacing: .08em; }
.ui-primary, button.ui-primary, a.ui-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px;
  padding: 10px 18px; border: 1px solid #5749dc; border-radius: var(--ui-control-radius);
  color: #fff; background: linear-gradient(135deg, #2563eb, #7c3aed); font-weight: 600; text-decoration: none;
}
.ui-primary:hover { background: linear-gradient(135deg, #1d4ed8, #6d28d9); }
.ui-secondary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border: 1px solid var(--ui-line-strong); border-radius: var(--ui-control-radius); color: var(--ui-ink); background: var(--ui-surface); text-decoration: none; }
.ui-hero { position: relative; isolation: isolate; padding: 24px 0 28px; }
.ui-hero::after { content: ""; position: absolute; z-index: -1; inset: -20px -20px 0 28%; pointer-events: none; border-radius: 24px; background: radial-gradient(ellipse at 75% 20%, rgb(154 108 255 / 12%), transparent 58%), radial-gradient(ellipse at 45% 80%, rgb(77 124 255 / 9%), transparent 60%); }
.ui-hero h1 { margin: 6px 0 12px; font-size: clamp(26px, 2.5vw, 38px); }
.ui-hero p { max-width: 740px; color: var(--ui-muted); }
.ui-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
.ui-col-4 { grid-column: span 4; }.ui-col-6 { grid-column: span 6; }.ui-col-8 { grid-column: span 8; }.ui-col-12 { grid-column: 1 / -1; }
.ui-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.ui-kpi { min-width: 0; padding: 17px; border: 1px solid var(--ui-line); border-radius: 13px; background: var(--ui-surface); box-shadow: var(--ui-shadow); }
.ui-kpi small { color: var(--ui-muted); font-size: 12px; }.ui-kpi strong { display: block; margin-top: 8px; font-size: 27px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.ui-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--ui-primary); background: var(--ui-primary-soft); }
.ui-badge[data-state="success"] { color: var(--ui-success); background: var(--ui-success-soft); }
.ui-badge[data-state="warning"] { color: var(--ui-warning); background: var(--ui-warning-soft); }
.ui-badge[data-state="danger"] { color: var(--ui-danger); background: var(--ui-danger-soft); }
.ui-empty { display: grid; place-items: center; gap: 10px; min-height: 180px; padding: 32px; border: 1px dashed var(--ui-line-strong); border-radius: var(--ui-radius); color: var(--ui-muted); background: var(--ui-surface-raised); text-align: center; }
.ui-notice { padding: 14px 18px; border: 1px solid var(--ui-line); border-radius: 10px; color: var(--ui-muted); background: var(--ui-surface-tint); }
.ui-error { padding: 14px 18px; border: 1px solid var(--ui-danger); border-radius: 10px; color: var(--ui-danger); background: var(--ui-danger-soft); }
.ui-skeleton { min-height: 100px; border-radius: 10px; background: linear-gradient(90deg, var(--ui-surface-tint), var(--ui-surface), var(--ui-surface-tint)); background-size: 200% 100%; animation: suite-skeleton 1.6s ease-in-out infinite; }
@keyframes suite-skeleton { to { background-position: -200% 0; } }
.suite-main table { color: var(--ui-ink); background: var(--ui-surface); }
.suite-main th { color: var(--ui-muted); background: var(--ui-surface-tint); }
.suite-main td, .suite-main th { border-color: var(--ui-line); }
.suite-main tbody tr:hover { background: var(--ui-surface-tint); }
dialog { color: var(--ui-ink); background: var(--ui-surface); border: 1px solid var(--ui-line); border-radius: 16px; box-shadow: var(--ui-shadow-float); }
dialog::backdrop { background: rgb(8 17 36 / 48%); backdrop-filter: blur(3px); }
.ui-chart { display: block; width: 100%; color: var(--ui-muted); }
.ui-chart text { fill: var(--ui-muted); font-family: var(--ui-font); font-size: 11px; }
.ui-chart .grid-line { stroke: var(--ui-grid); }
.ui-chart-legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--ui-muted); font-size: 12px; }
.ui-chart-legend i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 3px; background: var(--series-color, var(--ui-chart-1)); }
@media (max-width: 1100px) {
  :root { --ui-rail: 196px; }
  .suite-topbar { padding-inline: 18px; gap: 10px; }
  .suite-topbar .product-subtitle { display: none; }
  .ui-col-4 { grid-column: span 6; }.ui-col-8 { grid-column: 1 / -1; }

@media (max-width: 760px) {
  :root { --ui-top: 64px; --ui-rail: 224px; }
  .suite-topbar { padding: 9px 14px; gap: 8px; flex-wrap: nowrap; }

  .suite-topbar .product-name, .suite-topbar .product-brand strong { font-size: 16px; }
  .suite-theme-label > span { display: none; }
  .suite-theme-label select { width: 84px; }
  .suite-ui-tools { gap: 6px; }
  .suite-menu-toggle { display: inline-flex; }

  .suite-nav-open :is(#mainnav, #tabs, #suite-product-nav, nav.suite-side-nav).suite-side-nav { transform: translateX(0); visibility: visible; }
  .suite-has-sidebar main.suite-main { width: 100%; margin: 0; padding: 20px 16px 48px; }
  .suite-has-sidebar > .footer { margin-inline-start: 0; }
  .ui-grid { gap: 14px; }.ui-col-4, .ui-col-6, .ui-col-8 { grid-column: 1 / -1; }
  .ui-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ui-card { padding: 16px; }
  .ui-empty { padding: 24px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media print {
  :root, :root[data-suite-theme="dark"] { --ui-bg: #fff; --ui-surface: #fff; --ui-ink: #111827; --ui-muted: #4b5563; --ui-line: #d1d5db; }
  .suite-topbar, .suite-side-nav, .suite-ui-tools { display: none !important; }
  body.suite-has-header { padding: 0; }.suite-has-sidebar main.suite-main { width: 100%; margin: 0; padding: 0; }
}

<body data-suite-product="infrascout-report">
  <header data-ui-header><div><h1>InfraScout 离线报告</h1><div id="time"></div></div></header>
  <main><div id="app"></div></main>
  <script type="application/json" id="inventory">{{.Inventory}}</script>
  <script type="application/json" id="drift">{{.Drift}}</script>
  <script>
    (() => {
      "use strict";
      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
      const inventory = JSON.parse(document.querySelector("#inventory").textContent || "null") || {};
      const drift = JSON.parse(document.querySelector("#drift").textContent || "null") || {};
      document.querySelector("#time").textContent = inventory.collected_at || "";
      const summary = inventory.summary || {};
      const risk = ["CRITICAL", "WARNING", "INFO"].includes(drift.highest_risk) ? drift.highest_risk : "";
      const serviceRows = (inventory.detected_services || []).map((item) => `<tr><td>${esc(item.kind)}</td><td>${esc(item.name)}</td><td>${esc(item.source)}</td><td>${esc(Math.round(Number(item.confidence || 0) * 100))}%</td></tr>`).join("");
      const recommendations = ((inventory.monitoring_plan || {}).recommendations || []).map((item) => `<tr><td>${esc(item.priority)}</td><td>${esc(item.collector)}</td><td>${esc(item.reason)}</td></tr>`).join("");
      document.querySelector("#app").innerHTML =
        `<div class="metrics">${[["主机",summary.hosts],["进程",summary.processes],["监听端口",summary.endpoints],["服务",summary.services]].map((item) => `<div class="metric"><b>${esc(item[1] ?? 0)}</b>${esc(item[0])}</div>`).join("")}</div>` +
        `<section><h2>漂移结论</h2><p class="risk ${risk}">${esc(drift.highest_risk || "尚无漂移报告")}</p></section>` +
        `<section><h2>识别到的服务</h2><div class="table-wrap"><table><thead><tr><th>类型</th><th>名称</th><th>来源</th><th>置信度</th></tr></thead><tbody>${serviceRows || '<tr><td colspan="4" class="empty">没有识别到服务</td></tr>'}</tbody></table></div></section>` +
        `<section><h2>监控建议</h2><div class="table-wrap"><table><thead><tr><th>优先级</th><th>采集器</th><th>原因</th></tr></thead><tbody>${recommendations || '<tr><td colspan="3" class="empty">没有监控建议</td></tr>'}</tbody></table></div></section>`;
    })();
  </script>
<script>
/* Shared presentation only. Product code owns data, permissions and navigation. */
(() => {
  "use strict";
  const key = "ai-devops.ui.theme.v2";
  const modes = new Set(["light", "dark", "system"]);
  const system = window.matchMedia("(prefers-color-scheme: dark)");
  const mobile = window.matchMedia("(max-width: 760px)");
  let preferred = "system";
  let query = null;
  try {
    query = new URL(location.href).searchParams.get("suite-theme");
  } catch (_) { /* Embedded previews may not have a normal HTTP URL. */ }
  if (modes.has(query)) {
    preferred = query;
    try { localStorage.setItem(key, query); } catch (_) { /* The explicit URL still wins without storage. */ }
  } else {
    try {
      const saved = localStorage.getItem(key);
      if (modes.has(saved)) preferred = saved;
    } catch (_) { /* Private browsing must not disable the application. */ }
  }
  function resolve() { return preferred === "system" ? (system.matches ? "dark" : "light") : preferred; }
  function applyTheme() {
    document.documentElement.dataset.suiteTheme = resolve();
    document.documentElement.dataset.suiteThemeMode = preferred;
    document.querySelectorAll("[data-suite-theme-select]").forEach((el) => { el.value = preferred; });
    window.dispatchEvent(new CustomEvent("suite:themechange", { detail: { mode: preferred, resolved: resolve() } }));
  }
  applyTheme();
  const pagePaths = { suite: "suite.html", team: "team.html", providers: "team.html#providers", delivery: "team.html#missions" };
  function decorateLink(link) {
    const href = link.getAttribute("href");
    if (!href || href.startsWith("#")) return;
    let target;
    try { target = new URL(href, location.href); } catch (_) { return; }
    if (target.protocol !== "http:" && target.protocol !== "https:") return;
    const page = link.dataset.suitePage;
    if (Object.hasOwn(pagePaths, page || "")) {
      const base = new URL("/", target);
      const route = new URL(pagePaths[page], base);
      target.pathname = route.pathname;
      target.hash = route.hash;
    }
    target.searchParams.set("suite-theme", preferred);
    const next = target.href;
    if (link.href !== next) link.href = next;
  }
  const selector = "a[data-suite],a[data-module-port],a[data-suite-page],a[data-ui-link]";
  function refreshNavigation(root = document) {
    if (root.matches?.(selector)) decorateLink(root);
    root.querySelectorAll?.(selector).forEach(decorateLink);
  }
  function setTheme(mode) {
    if (!modes.has(mode)) return;
    preferred = mode;
    try { localStorage.setItem(key, mode); } catch (_) { /* Optional storage. */ }
    try {
      const current = new URL(location.href);
      current.searchParams.set("suite-theme", mode);
      history.replaceState(history.state, "", current);
    } catch (_) { /* Embedded or file-based previews may deny history writes. */ }
    applyTheme();
    refreshNavigation();
  }
  system.addEventListener("change", () => { if (preferred === "system") applyTheme(); });
  Object.defineProperty(window, "SuiteUI", { value: Object.freeze({ setTheme, getTheme: () => preferred, refreshNavigation }), writable: false });
  function initialize() {
    const body = document.body;
    const header = document.querySelector("[data-ui-header]") || document.querySelector("body > header.topbar,body > header");
    const navSelector = body.dataset.suiteNav;
    let nav = null;
    if (navSelector) {
      try { nav = document.querySelector(navSelector); } catch (_) { /* Trusted markup typo has no runtime authority. */ }
    }
    nav ||= document.querySelector("[data-ui-nav]");
    const main = document.querySelector("[data-ui-main]") || document.querySelector("main");
    if (header) { header.classList.add("suite-topbar"); body.classList.add("suite-has-header"); }
    if (nav) {
      nav.classList.add("suite-side-nav");
      if (!nav.id) nav.id = "suite-product-nav";
      body.classList.add("suite-has-sidebar");
      if (main) main.classList.add("suite-main");
    }
    if (header && !header.querySelector(".suite-ui-tools")) {
      const tools = document.createElement("div");
      tools.className = "suite-ui-tools";
      const label = document.createElement("label");
      label.className = "suite-theme-label";
      const text = document.createElement("span");
      text.textContent = "主题";
      const theme = document.createElement("select");
      theme.dataset.suiteThemeSelect = "";
      theme.setAttribute("aria-label", "外观 / Appearance");
      for (const [value, title] of [["light", "浅色 · Light"], ["dark", "深色 · Dark"], ["system", "随系统 · Auto"]]) {
        const option = document.createElement("option"); option.value = value; option.textContent = title; theme.append(option);
      }
      theme.value = preferred;
      theme.addEventListener("change", () => setTheme(theme.value));
      label.append(text, theme); tools.append(label);
      if (nav) {
        const toggle = document.createElement("button");
        toggle.type = "button"; toggle.className = "suite-menu-toggle";
        toggle.setAttribute("aria-label", "打开导航 / Open navigation");
        toggle.setAttribute("aria-controls", nav.id); toggle.setAttribute("aria-expanded", "false");
        toggle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
        function closeMenu(restoreFocus = false) {
          body.classList.remove("suite-nav-open"); toggle.setAttribute("aria-expanded", "false");
          if (restoreFocus) toggle.focus();
        }
        toggle.addEventListener("click", () => {
          const open = body.classList.toggle("suite-nav-open");
          toggle.setAttribute("aria-expanded", String(open));
          if (open) nav.querySelector("a,button")?.focus();
        });
        nav.addEventListener("click", (event) => {
          if (!mobile.matches || !event.target.closest("a,button")) return;
          closeMenu();
          if (main && nav.contains(document.activeElement)) {
            if (!main.hasAttribute("tabindex")) main.tabIndex = -1;
            main.focus({ preventScroll: true });
          }
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && body.classList.contains("suite-nav-open")) { closeMenu(true); event.preventDefault(); }
        });
        document.addEventListener("click", (event) => {
          if (mobile.matches && !nav.contains(event.target) && !toggle.contains(event.target)) closeMenu();
        });
        mobile.addEventListener("change", () => closeMenu());
        tools.prepend(toggle);
      }
      header.append(tools);
    }
    if (header) {
      const fitHeader = () => {
        const height = header.getBoundingClientRect().height;
        if (height > 0 && Number.isFinite(height)) {
          document.documentElement.style.setProperty("--ui-header-space", `${height}px`);
        }
      };
      fitHeader();
      if (typeof ResizeObserver === "function") new ResizeObserver(fitHeader).observe(header);
      else window.addEventListener("resize", fitHeader);
    }
    refreshNavigation();
    // Existing module discovery may resolve sibling ports after page load.
    // Keep its URL and Suite context, adding presentation state only.
    new MutationObserver((records) => {
      for (const record of records) {
        if (record.type === "attributes" && record.target.matches(selector)) decorateLink(record.target);
        for (const node of record.addedNodes) if (node.nodeType === 1) refreshNavigation(node);
      }
    }).observe(body, { childList: true, subtree: true, attributes: true, attributeFilter: ["href"] });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initialize, { once: true });
  else initialize();
})();

</script>
